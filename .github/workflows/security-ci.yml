name: COMPDEC Security CI

on:
  push:
    paths:
      - 'apps/compdec-gestao-v3/**'
  pull_request:
    paths:
      - 'apps/compdec-gestao-v3/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/compdec-gestao-v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/compdec-gestao-v3/package-lock.json
            apps/compdec-gestao-v3/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: test -f package-lock.json && npm ci || npm install
      - run: test -f functions/package-lock.json && npm --prefix functions ci || npm --prefix functions install
      - run: npm run typecheck
      - run: npm run build
      - run: npm --prefix functions run build
      - run: npm run test:rules
      - run: bash scripts/check-secrets.sh
